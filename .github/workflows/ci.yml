name: CI

on:
  push:
    branches: [main, master]
    # 推 v 开头的 tag 时自动构建并发布 Release，任何人无需登录即可下载安装包。
    tags: ["v*"]
    # 纯文档改动不需要跑代码门禁；tag 推送不受路径过滤影响。
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "填了则按该 tag 创建/更新 Release（如 v0.1.0）；留空只出 Actions Artifacts"
        required: false
        type: string

# 同一个 ref 上只保留最新一次运行：PR 取消旧任务省资源，main/tag 排队避免重复发版。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 默认只读，只有发版 job 需要写 Release；避免每个 job 继承仓库的宽权限。
permissions:
  contents: read

jobs:
  frontend:
    name: 前端检查（格式 / lint / 规范 / 单测 / 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # 不传 version，由 package.json 的 packageManager 决定 pnpm 版本，避免两处配置漂移。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # check 同时校验格式与 lint，避免只跑 lint 时格式漂移无人发现。
      - run: pnpm check
      - run: pnpm check:conventions
      - run: pnpm test
      # build 脚本内部已经执行 vue-tsc --noEmit，不再单独重复一次类型检查。
      - run: pnpm build

  backend:
    # 门禁只放「单测 / 编译」这种当前全绿的检查。存量代码尚未通过 rustfmt 与
    # clippy -D warnings（旧命令层有 redundant_closure 等），待单独清理后再加入，
    # 否则 CI 从第一天起就是红的，反而失去门禁意义。
    name: Rust 检查（编译 / 单测）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Tauri 在 Linux 编译 wry/tauri 依赖这些系统库，缺失会直接编译失败。
      # libxdo-dev 是 Tauri v2 官方 prerequisites 之一，runner 默认不带。
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # --locked 强制使用已提交的 Cargo.lock，避免 CI 静默解析出不同版本的依赖。
      - run: cargo check --all-targets --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri

  desktop:
    name: 桌面安装包（${{ matrix.name }}）
    # 每次触发都打包（含日常 push），尽早发现 tauri 打包回归；仅 PR 跳过，避免每个 PR 都跑三平台构建。
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    strategy:
      # 某个平台失败不影响其他平台出包。
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: windows
            # msi 适合企业分发，nsis exe 双击即装。
            bundles: msi,nsis
          - os: ubuntu-22.04
            name: Linux
            artifact: linux
            # 用 22.04 而不是 latest：AppImage 依赖较老的 glibc，兼容性更好。
            # 不打包 rpm，省去 runner 上额外安装 rpmbuild。
            bundles: deb,appimage
          - os: macos-latest
            name: macOS
            artifact: macos
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri 在 Linux 编译 wry/tauri 依赖这些系统库，缺失会直接编译失败。
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      # tauri build 会先跑 beforeBuildCommand（pnpm build），再编译 Rust 并按 --bundles 产出安装包。
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ink-harness-${{ matrix.artifact }}
          # 一次性覆盖三平台产物；各平台只会匹配到自己的那几条 glob。
          # .app 是目录且已包含在 dmg 中，不作为单独资产保留。
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release（公开下载）
    # 必须等所有检查通过，避免单测红灯时仍把安装包发出去。
    needs: [frontend, backend, desktop]
    # 打 tag 推送，或手动触发并填了 release_tag 时才发版。
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # 创建 Release 与上传资产需要写权限；仓库的 Workflow 权限也要允许写。
      contents: write
    steps:
      - name: 下载三平台构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          # 三个 artifact 解到同一目录，后续按扩展名统一匹配。
          merge-multiple: true
      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          # 打 tag 时用 tag 名；手动触发时用输入值（两者都是公开可访问的版本号）。
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: INK-HARNESS ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          # 有安装包缺失时直接失败，避免静默发布不完整的 Release。
          fail_on_unmatched_files: true
          # 只发布安装包本体；.app 是目录，已包含在 dmg 里，不作为单独资产上传。
          files: |
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.deb
            release-assets/**/*.AppImage
            release-assets/**/*.dmg
