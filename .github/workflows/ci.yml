name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # 支持在 Actions 页面手动触发，用于单独打一次 Windows 安装包。
  workflow_dispatch:

jobs:
  frontend:
    name: 前端检查（类型 / lint / 规范 / 单测 / 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:conventions
      - run: pnpm test
      - run: pnpm build

  backend:
    # 门禁只放「单测 / 编译」这种当前全绿的检查。存量代码尚未通过 rustfmt 与
    # clippy -D warnings（旧命令层有 redundant_closure 等），待单独清理后再加入，
    # 否则 CI 从第一天起就是红的，反而失去门禁意义。
    name: Rust 检查（编译 / 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tauri 在 Linux 编译 wry/tauri 依赖这些系统库，缺失会直接编译失败。
      # 脚本内容必须比 run: 缩进更深，否则不被识别为块标量、这一步形同虚设。
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --all-targets
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  desktop:
    name: 桌面安装包（${{ matrix.name }}）
    # 安装包构建较重，只在推送到主分支或手动触发时跑；PR 不打包。
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    strategy:
      # 某个平台失败不影响其他平台出包。
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: windows
            # msi 适合企业分发，nsis exe 双击即装。
            bundles: msi,nsis
          - os: ubuntu-22.04
            name: Linux
            artifact: linux
            # 用 22.04 而不是 latest：AppImage 依赖较老的 glibc，兼容性更好。
            # 不打包 rpm，省去 runner 上额外安装 rpmbuild。
            bundles: deb,appimage
          - os: macos-latest
            name: macOS
            artifact: macos
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri 在 Linux 编译 wry/tauri 依赖这些系统库，缺失会直接编译失败。
      # 脚本内容必须比 run: 缩进更深，否则不被识别为块标量、这一步形同虚设。
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      # tauri build 会先跑 beforeBuildCommand（pnpm build），再编译 Rust 并按 --bundles 产出安装包。
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ink-harness-${{ matrix.artifact }}
          # 一次性覆盖三平台产物；各平台只会匹配到自己的那几条 glob。
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
