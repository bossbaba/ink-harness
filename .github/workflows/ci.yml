name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: 前端检查（类型 / lint / 规范 / 单测 / 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:conventions
      - run: pnpm test
      - run: pnpm build

  backend:
    # 门禁只放「单测 / 编译」这种当前全绿的检查。存量代码尚未通过 rustfmt 与
    # clippy -D warnings（旧命令层有 redundant_closure 等），待单独清理后再加入，
    # 否则 CI 从第一天起就是红的，反而失去门禁意义。
    name: Rust 检查（编译 / 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tauri 在 Linux 编译 wry/tauri 依赖这些系统库，缺失会直接编译失败。
      # 脚本内容必须比 run: 缩进更深，否则不被识别为块标量、这一步形同虚设。
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --all-targets
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
