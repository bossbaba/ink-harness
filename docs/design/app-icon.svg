<?xml version="1.0" encoding="UTF-8" ?>
<!--
  INK-HARNESS 应用图标（设计源文件，画布 1024x1024）
  语义与项目纸墨色板（src/styles/_tokens.scss / src/theme/palette.ts）严格一致：
  - 纸底 = $paper #f7f5f0：全出血方块，与旧图标格式一致，.ico/.icns/ios 均可直接用。
  - 墨滴 = $ink #1f1e1d：点尖朝上的标准墨滴形（与"地图 pin"的点尖朝下相反），
    直接表达 INK（写作/墨），也是"纸墨"主题的最小符号。
  - 星光 = $accent #00c100：品牌绿四角星光（AI 辅助），一大一小缀在右上，
    呼应"作者落墨、AI 增辉"的产品理念；右侧留白呼应水墨的"计白当黑"。
  小尺寸可读性：纯色块无细节，16px 下仍是"墨滴 + 两个绿点"，不糊不碎。
  再生成流程：
    qlmanage -t -s 2048 渲染本文件 → sips 缩到 1024（抗锯齿更细腻）
    → pnpm tauri icon docs/design/app-icon-1024.png 生成 src-tauri/icons/ 全套尺寸。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>INK-HARNESS 应用图标</title>
  <!-- 纸底：全出血，避免各平台图标出现透明边 -->
  <rect width="1024" height="1024" fill="#f7f5f0" />

  <!--
    墨滴主体：上半部两段贝塞尔做出饱满的肩部（比直线更"液滴"），
    底部用 r=244 的半圆收口，圆心 (512,548)，与贝塞尔端点相切、过渡平滑。
  -->
  <path
    fill="#1f1e1d"
    d="M 512 168
       C 640 344 756 416 756 548
       A 244 244 0 1 1 268 548
       C 268 416 384 344 512 168 Z"
  />

  <!-- 品牌绿星光（大）：四边向内凹的四角星（标准 sparkle 造型），置于墨滴右上 -->
  <path
    fill="#00c100"
    d="M 828 132
       C 828 202 858 232 928 232
       C 858 232 828 262 828 332
       C 828 262 798 232 728 232
       C 798 232 828 202 828 132 Z"
  />

  <!-- 品牌绿星光（小）：与大星光呼应，避免右上角头重脚轻 -->
  <path
    fill="#00c100"
    d="M 902 356
       C 902 382 915 399 945 399
       C 915 399 902 412 902 442
       C 902 412 889 399 859 399
       C 889 399 902 382 902 356 Z"
  />
</svg>
